name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: publint / are-the-types-wrong (node16/bundler 기준)
        run: |
          for p in core-validate zod holidays-core dayjs; do
            pnpm --filter "@kr-kit/$p" exec publint
            pnpm --filter "@kr-kit/$p" exec attw --pack . --profile node16 || true
          done
