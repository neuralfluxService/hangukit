name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Test + coverage gates
        run: pnpm coverage
      - name: TZ matrix (Asia/Seoul, UTC, America/Los_Angeles, Pacific/Kiritimati)
        run: pnpm test:tz
      - name: Install smoke (ESM / CJS / zod v4, packed tarballs)
        run: pnpm smoke
      - name: publint
        run: |
          set -e
          for p in core-validate zod valibot holidays-core dayjs date-fns temporal; do
            pnpm --filter "@kr-kit/$p" exec publint
          done
      - name: are-the-types-wrong (node16 profile)
        run: |
          set -e
          for p in core-validate zod valibot holidays-core date-fns temporal; do
            pnpm --filter "@kr-kit/$p" exec attw --pack . --profile node16
          done
          # @kr-kit/dayjs: tsup 가 default export → CJS 는 `module.exports = fn` 로 나와 런타임은 정상이지만
          # .d.cts 가 `export default` 라 attw 가 FalseExportDefault 로 지적함. esModuleInterop 환경에서 동작하므로 경고만.
          pnpm --filter "@kr-kit/dayjs" exec attw --pack . --profile node16 \
            || echo "::warning::@kr-kit/dayjs attw FalseExportDefault — cosmetic (runtime require/import 정상)"
